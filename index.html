<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MLK SERVICES | Création Digitale & Visibilité</title>
  <meta name="description" content="MLK SERVICES - Développement web, visibilité TikTok, pronostics sportifs. Des solutions digitales premium." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <!-- Polices Google Fonts (Inter + Space Grotesk) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
  (function() {
    const saved = localStorage.getItem('mlk-theme');
    if (saved === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>
  <!-- L'application sera montée ici via les composants JS -->
  <div id="app">
    <!-- Navbar, Hero, etc. seront insérés dynamiquement -->
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
