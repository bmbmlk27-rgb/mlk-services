    <!-- ==========================
         THEME SYSTEM
         Evite le flash blanc
    =========================== -->

    <script>

        (function(){


            try {


                const savedTheme =
                localStorage.getItem("theme");


                document.documentElement.dataset.theme =
                savedTheme || "dark";



            } catch(error){


                document.documentElement.dataset.theme =
                "dark";


            }



        })();


    </script>
